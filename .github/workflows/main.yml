name: 🗓️ Daily Sitemap Build & Publish

# ---------------------------------------------------
# Prevents auto-disabling by:
# 1. Daily run
# 2. Monthly keepalive ping that commits a no-op
# ---------------------------------------------------
on:
  schedule:
    - cron: "0 1 * * *"          # daily at 01:00 UTC
    - cron: "0 0 1 * *"          # keepalive: first day of every month
  workflow_dispatch:             # manual trigger keeps workflow active

permissions:
  contents: write                # needed for keepalive commit

jobs:
  keepalive:
    # This job only runs on the monthly cron
    if: github.event.schedule == '0 0 1 * *'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Touch keepalive file
        run: |
          echo "last-run=$(date -u)" > .github/keepalive.txt

      - name: Commit & Push Keepalive
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git add .github/keepalive.txt
          git commit -m "Keepalive: prevent workflow disable" || echo "No changes"
          git push

  build-publish:
    runs-on: ubuntu-latest

    env:
      CSV_URL: ./combined_google_merchant_feed.csv
      LINK_COL: link
      R2_BUCKET: leela-feeds
      R2_PREFIX: sitemaps
      OUTPUT_DIR: ./sitemaps_out
      PUBLIC_BASE_URL: https://feeds.leeladiamond.com/sitemaps
      PER_FILE: "50000"
      SITEMAP_INDEX_NAME: sitemap-index.xml
      SITEMAP_PREFIX: leela-products-

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install pandas lxml requests

      - name: Install AWS CLI
        run: pip install awscli

      - name: Download source feed from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          test -n "$R2_ENDPOINT" || (echo "Missing R2_ENDPOINT secret" && exit 1)
          aws s3 cp "s3://${R2_BUCKET}/Googlefinal/combined_google_merchant_feed.csv" "$CSV_URL" --endpoint-url "$R2_ENDPOINT"

      # ---------- GENERATE SITEMAPS ----------
      - name: Generate sitemaps
        run: |
          python generate_sitemaps.py \
            --csv "$CSV_URL" \
            --outdir "$OUTPUT_DIR" \
            --basename "$SITEMAP_PREFIX" \
            --per-file "$PER_FILE" \
            --public-base-url "$PUBLIC_BASE_URL" \
            --index-name "$SITEMAP_INDEX_NAME" \
            --link-column "$LINK_COL"

      - name: Verify output exists
        run: |
          test -d "${OUTPUT_DIR}" || (echo "Missing ${OUTPUT_DIR}" && exit 1)
          ls -la "${OUTPUT_DIR}"
          if ! ls "${OUTPUT_DIR}/${SITEMAP_INDEX_NAME}" >/dev/null 2>&1; then
            echo "${SITEMAP_INDEX_NAME} not found in ${OUTPUT_DIR}" && exit 1
          fi

      # ---------- UPLOAD TO R2 ----------
      - name: Upload sitemaps to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          aws s3 rm "s3://${R2_BUCKET}/${R2_PREFIX}" --recursive --endpoint-url "$R2_ENDPOINT" || true
          aws s3 cp "${OUTPUT_DIR}" "s3://${R2_BUCKET}/${R2_PREFIX}" \
            --recursive \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type "application/xml" \
            --cache-control "public, max-age=86400"

      # ---------- PURGE CLOUDFLARE CACHE ----------
      - name: Purge Cloudflare cache for /sitemaps/*
        env:
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":false,"files":["https://feeds.leeladiamond.com/sitemaps/sitemap-index.xml","https://feeds.leeladiamond.com/sitemaps/"]}' \
            | tee /tmp/cf_purge.json
          echo "Cloudflare purge response:" && cat /tmp/cf_purge.json
